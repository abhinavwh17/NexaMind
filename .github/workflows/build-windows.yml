name: Build NexaMind Windows

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build NexaMind executable
        run: |
          pyinstaller --clean NexaMind.spec

      - name: Verify executable
        shell: powershell
        run: |
          if (!(Test-Path "dist\NexaMind.exe")) {
            Write-Error "NexaMind.exe was not generated"
            exit 1
          }

          Write-Host "NexaMind.exe generated successfully"

      - name: Create Windows package
        shell: powershell
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path package

          Copy-Item `
            dist\NexaMind.exe `
            package\NexaMind.exe

          Compress-Archive `
            -Path package\* `
            -DestinationPath NexaMind-Windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexaMind-Windows
          path: NexaMind-Windows.zip
          if-no-files-found: error